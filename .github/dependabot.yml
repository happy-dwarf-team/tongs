version: 2
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot moves the pins.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  # The MCP server's Python dependencies (mcp/pyproject.toml and mcp/uv.lock).
  # They reach users with the next release, so the entry is a build change.
  - package-ecosystem: uv
    directory: /mcp
    schedule:
      interval: monthly
    groups:
      mcp:
        patterns: ["*"]
    commit-message:
      prefix: build(mcp)
