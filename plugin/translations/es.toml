# The plugin's texts in Spanish: the description in plugin.toml and the
# settings' texts in settings.toml, each by its English words.
# Change them together with the English text: anvil check reports an entry that no longer matches.
status = "draft"            # "checked" once a native speaker checked it

[text]
"Control EU4 from scripts and agents: a local command pipe that reads the state of a running game and, when allowed, uses its keyboard and mouse and runs console commands." = "Controla EU4 desde scripts y agentes: una tubería de comandos local que lee el estado de una partida en curso y, si se permite, usa su teclado y su ratón y ejecuta comandos de consola."
"Open the pipe" = "Abrir la tubería"
"Opens the local pipe \\\\.\\pipe\\tongs for the current Windows user, so that scripts and agents can read the game's state." = "Abre la tubería local \\\\.\\pipe\\tongs para el usuario actual de Windows, para que scripts y agentes puedan leer el estado del juego."
"Keyboard, mouse and navigation commands" = "Comandos de teclado, ratón y navegación"
"Also accepts the keyboard and mouse commands (pause, speed, run_until, key, text, click...): input queued in the game's own SDL input, as a player's would be, and a hook so that the interface sees the mouse pointer; and navigation (province open, province goto), which moves the camera and opens a province's view as the game's own links do." = "También acepta los comandos de teclado y ratón (pause, speed, run_until, key, text, click...): entrada puesta en la cola SDL del propio juego, como la de un jugador, y un hook para que la interfaz vea el puntero del ratón; y la navegación (province open, province goto), que mueve la cámara y abre la vista de una provincia como lo hacen los enlaces del juego."
"Command journal" = "Registro de comandos"
"Writes every command a script or agent sends on the pipe, with its outcome and the game date, to anvil/data/tongs/journal/ (one file per game start, the newest 20 kept), so a test can be followed and repeated. Nothing of it goes into the game, its saves or multiplayer." = "Escribe cada comando que un script o un agente envía por la tubería, con su resultado y la fecha del juego, en anvil/data/tongs/journal/ (un archivo por inicio del juego, se conservan los 20 más recientes), para poder seguir y repetir una prueba. Nada de ello llega al juego, a sus partidas guardadas ni al multijugador."
"Game calls (console commands)" = "Llamadas al juego (comandos de consola)"
"Also accepts `console LINE`: console commands run by the game's own code on its main thread. They CHANGE GAME STATE; every call is counted and logged. enable_all_commands and the achievement and social commands are always refused." = "También acepta `console LINE`: comandos de consola ejecutados por el propio código del juego en su hilo principal. CAMBIAN EL ESTADO DEL JUEGO; cada llamada se cuenta y se registra. enable_all_commands y los comandos de logros y sociales se rechazan siempre."
"Game calls" = "Llamadas al juego"
"Allowed danger commands" = "Comandos peligrosos permitidos"
"Danger commands that game calls may run besides the safe ones, as names separated by commas or spaces, e.g. \"leak\"." = "Comandos peligrosos que las llamadas al juego pueden ejecutar además de los seguros, como nombres separados por comas o espacios, p. ej. \"leak\"."
"Game calls in ironman" = "Llamadas al juego en ironman"
"Game calls in an ironman game. Anvil also has to allow Tongs in ironman (allow_ironman = [\"tongs\"] in anvil/anvil.toml)." = "Llamadas al juego en una partida ironman. Anvil también tiene que permitir Tongs en ironman (allow_ironman = [\"tongs\"] en anvil/anvil.toml)."
"Game calls in multiplayer" = "Llamadas al juego en multijugador"
"Game calls in a multiplayer game. Anvil also has to allow Tongs in multiplayer (allow_multiplayer = [\"tongs\"] in anvil/anvil.toml)." = "Llamadas al juego en una partida multijugador. Anvil también tiene que permitir Tongs en multijugador (allow_multiplayer = [\"tongs\"] en anvil/anvil.toml)."
