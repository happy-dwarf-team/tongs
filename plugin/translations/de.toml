# The plugin's texts in German: the description in plugin.toml and the
# settings' texts in settings.toml, each by its English words.
# Change them together with the English text: anvil check reports an entry that no longer matches.
status = "draft"            # "checked" once a native speaker checked it

[text]
"Control EU4 from scripts and agents: a local command pipe that reads the state of a running game and, when allowed, uses its keyboard and mouse and runs console commands." = "EU4 aus Skripten und Agenten steuern: eine lokale Befehls-Pipe, die den Zustand eines laufenden Spiels liest und, wenn erlaubt, seine Tastatur und Maus bedient und Konsolenbefehle ausführt."
"Open the pipe" = "Pipe öffnen"
"Opens the local pipe \\\\.\\pipe\\tongs for the current Windows user, so that scripts and agents can read the game's state." = "Öffnet die lokale Pipe \\\\.\\pipe\\tongs für den aktuellen Windows-Benutzer, damit Skripte und Agenten den Zustand des Spiels lesen können."
"Keyboard, mouse and navigation commands" = "Tastatur-, Maus- und Navigationsbefehle"
"Also accepts the keyboard and mouse commands (pause, speed, run_until, key, text, click...): input queued in the game's own SDL input, as a player's would be, and a hook so that the interface sees the mouse pointer; and navigation (province open, province goto), which moves the camera and opens a province's view as the game's own links do." = "Nimmt auch die Tastatur- und Mausbefehle an (pause, speed, run_until, key, text, click...): Eingaben in der eigenen SDL-Eingabe des Spiels, wie die eines Spielers, und ein Hook, damit die Oberfläche den Mauszeiger sieht; dazu die Navigation (province open, province goto), die die Kamera bewegt und die Ansicht einer Provinz öffnet, wie es die Links des Spiels tun."
"Command journal" = "Befehlsjournal"
"Writes every command a script or agent sends on the pipe, with its outcome and the game date, to anvil/data/tongs/journal/ (one file per game start, the newest 20 kept), so a test can be followed and repeated. Nothing of it goes into the game, its saves or multiplayer." = "Schreibt jeden Befehl, den ein Skript oder Agent über die Pipe sendet, mit seinem Ergebnis und dem Spieldatum nach anvil/data/tongs/journal/ (eine Datei pro Spielstart, die neuesten 20 bleiben), damit sich ein Test nachvollziehen und wiederholen lässt. Nichts davon gelangt ins Spiel, in seine Spielstände oder in den Mehrspielermodus."
"Game calls (console commands)" = "Spielaufrufe (Konsolenbefehle)"
"Also accepts `console LINE`: console commands run by the game's own code on its main thread. They CHANGE GAME STATE; every call is counted and logged. enable_all_commands and the achievement and social commands are always refused." = "Nimmt auch `console LINE` an: Konsolenbefehle, die der eigene Code des Spiels auf seinem Hauptthread ausführt. Sie ÄNDERN DEN SPIELZUSTAND; jeder Aufruf wird gezählt und protokolliert. enable_all_commands sowie die Erfolgs- und Social-Befehle werden immer abgelehnt."
"Game calls" = "Spielaufrufe"
"Allowed danger commands" = "Erlaubte gefährliche Befehle"
"Danger commands that game calls may run besides the safe ones, as names separated by commas or spaces, e.g. \"leak\"." = "Gefährliche Befehle, die Spielaufrufe neben den sicheren ausführen dürfen, als durch Kommas oder Leerzeichen getrennte Namen, z. B. \"leak\"."
"Game calls in ironman" = "Spielaufrufe im Ironman"
"Game calls in an ironman game. Anvil also has to allow Tongs in ironman (allow_ironman = [\"tongs\"] in anvil/anvil.toml)." = "Spielaufrufe in einem Ironman-Spiel. Anvil muss Tongs ebenfalls im Ironman erlauben (allow_ironman = [\"tongs\"] in anvil/anvil.toml)."
"Game calls in multiplayer" = "Spielaufrufe im Mehrspielermodus"
"Game calls in a multiplayer game. Anvil also has to allow Tongs in multiplayer (allow_multiplayer = [\"tongs\"] in anvil/anvil.toml)." = "Spielaufrufe in einem Mehrspielerspiel. Anvil muss Tongs ebenfalls im Mehrspielermodus erlauben (allow_multiplayer = [\"tongs\"] in anvil/anvil.toml)."
