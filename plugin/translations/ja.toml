# The plugin's texts in Japanese: the description in plugin.toml and the
# settings' texts in settings.toml, each by its English words.
# Change them together with the English text: anvil check reports an entry that no longer matches.
status = "draft"            # "checked" once a native speaker checked it

[text]
"Control EU4 from scripts and agents: a local command pipe that reads the state of a running game and, when allowed, uses its keyboard and mouse and runs console commands." = "スクリプトやエージェントから EU4 を操作します。実行中のゲームの状態を読み取り、許可した場合はキーボードとマウスを操作してコンソールコマンドを実行する、ローカルのコマンドパイプです。"
"Open the pipe" = "パイプを開く"
"Opens the local pipe \\\\.\\pipe\\tongs for the current Windows user, so that scripts and agents can read the game's state." = "現在の Windows ユーザー向けにローカルパイプ \\\\.\\pipe\\tongs を開き、スクリプトやエージェントがゲームの状態を読み取れるようにします。"
"Keyboard, mouse and navigation commands" = "キーボード、マウス、ナビゲーションのコマンド"
"Also accepts the keyboard and mouse commands (pause, speed, run_until, key, text, click...): input queued in the game's own SDL input, as a player's would be, and a hook so that the interface sees the mouse pointer; and navigation (province open, province goto), which moves the camera and opens a province's view as the game's own links do." = "キーボードとマウスのコマンド（pause、speed、run_until、key、text、click…）も受け付けます。入力はプレイヤーの操作と同じくゲーム自身の SDL 入力に積まれ、フックによってインターフェースがマウスポインターを認識します。ナビゲーション（province open、province goto）は、ゲーム内のリンクと同じようにカメラを動かしてプロヴィンスの画面を開きます。"
"Command journal" = "コマンド記録"
"Writes every command a script or agent sends on the pipe, with its outcome and the game date, to anvil/data/tongs/journal/ (one file per game start, the newest 20 kept), so a test can be followed and repeated. Nothing of it goes into the game, its saves or multiplayer." = "スクリプトやエージェントがパイプに送ったすべてのコマンドを、結果とゲーム内の日付とともに anvil/data/tongs/journal/ に書き込みます（ゲームの起動ごとに 1 ファイル、最新の 20 件を保持）。テストを追跡して再現できます。ゲーム、セーブ、マルチプレイには何も入りません。"
"Game calls" = "ゲーム呼び出し"
"Lets scripts and agents run console commands and load saves, which change the game." = "スクリプトやエージェントがコンソールコマンドを実行し、セーブをロードできるようにします。これらはゲームを変更します。"
"Allowed danger commands" = "許可する危険なコマンド"
"Danger commands that game calls may run besides the safe ones, as names separated by commas or spaces, e.g. \"leak\"." = "安全なコマンドに加えてゲーム呼び出しが実行できる危険なコマンド。名前をカンマまたは空白で区切って指定します（例: \"leak\"）。"
"Loopback socket under Wine" = "Wine 下のループバックソケット"
"Under Wine and Proton, also serves the pipe's commands on a socket on 127.0.0.1, so that a native Linux client can reach Tongs without a relay. It needs Open the pipe. The port and a token go to bridge.json in the folder below, which only you should be able to enter. Ignored on Windows." = "Wine と Proton の下で、パイプのコマンドを 127.0.0.1 のソケットでも提供し、ネイティブ Linux のクライアントがリレーなしで Tongs に接続できるようにします。「パイプを開く」が必要です。ポートとトークンは下のフォルダーの bridge.json に書かれます。そのフォルダーには自分だけが入れるようにしてください。Windows では無視されます。"
"Folder of bridge.json" = "bridge.json のフォルダー"
"Where bridge.json goes, as a Unix path such as /run/user/1000/tongs or a Windows path. Empty means ~/.local/state/tongs. Whoever can read the token can drive the game, so use a folder only you can enter." = "bridge.json の書き込み先を、/run/user/1000/tongs のような Unix パスまたは Windows パスで指定します。空の場合は ~/.local/state/tongs です。トークンを読める人はゲームを操作できるため、自分だけが入れるフォルダーを使ってください。"
"Wine and Proton" = "Wine と Proton"
