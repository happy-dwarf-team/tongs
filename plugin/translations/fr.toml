# The plugin's texts in French: the description in plugin.toml and the
# settings' texts in settings.toml, each by its English words.
# Change them together with the English text: anvil check reports an entry that no longer matches.
status = "draft"            # "checked" once a native speaker checked it

[text]
"Control EU4 from scripts and agents: a local command pipe that reads the state of a running game and, when allowed, uses its keyboard and mouse and runs console commands." = "Contrôlez EU4 depuis des scripts et des agents : un canal de commandes local qui lit l'état d'une partie en cours et, si vous l'autorisez, utilise son clavier et sa souris et exécute des commandes de console."
"Open the pipe" = "Ouvrir le canal"
"Opens the local pipe \\\\.\\pipe\\tongs for the current Windows user, so that scripts and agents can read the game's state." = "Ouvre le canal local \\\\.\\pipe\\tongs pour l'utilisateur Windows actuel, afin que des scripts et des agents puissent lire l'état du jeu."
"Keyboard, mouse and navigation commands" = "Commandes de clavier, de souris et de navigation"
"Also accepts the keyboard and mouse commands (pause, speed, run_until, key, text, click...): input queued in the game's own SDL input, as a player's would be, and a hook so that the interface sees the mouse pointer; and navigation (province open, province goto), which moves the camera and opens a province's view as the game's own links do." = "Accepte aussi les commandes de clavier et de souris (pause, speed, run_until, key, text, click...) : des entrées placées dans la file SDL du jeu, comme celles d'un joueur, et un hook pour que l'interface voie le pointeur de la souris ; ainsi que la navigation (province open, province goto), qui déplace la caméra et ouvre la vue d'une province comme le font les liens du jeu."
"Command journal" = "Journal des commandes"
"Writes every command a script or agent sends on the pipe, with its outcome and the game date, to anvil/data/tongs/journal/ (one file per game start, the newest 20 kept), so a test can be followed and repeated. Nothing of it goes into the game, its saves or multiplayer." = "Écrit chaque commande qu'un script ou un agent envoie sur le canal, avec son résultat et la date du jeu, dans anvil/data/tongs/journal/ (un fichier par lancement du jeu, les 20 plus récents conservés), afin de pouvoir suivre et répéter un test. Rien n'en passe dans le jeu, ses sauvegardes ou le multijoueur."
"Game calls (console commands)" = "Appels au jeu (commandes de console)"
"Also accepts `console LINE`: console commands run by the game's own code on its main thread. They CHANGE GAME STATE; every call is counted and logged. enable_all_commands and the achievement and social commands are always refused." = "Accepte aussi `console LINE` : des commandes de console exécutées par le code du jeu sur son thread principal. Elles MODIFIENT L'ÉTAT DU JEU ; chaque appel est compté et journalisé. enable_all_commands et les commandes de succès et sociales sont toujours refusées."
"Game calls" = "Appels au jeu"
"Allowed danger commands" = "Commandes dangereuses autorisées"
"Danger commands that game calls may run besides the safe ones, as names separated by commas or spaces, e.g. \"leak\"." = "Commandes dangereuses que les appels au jeu peuvent exécuter en plus des commandes sûres, sous forme de noms séparés par des virgules ou des espaces, p. ex. \"leak\"."
"Game calls in ironman" = "Appels au jeu en ironman"
"Game calls in an ironman game. Anvil also has to allow Tongs in ironman (allow_ironman = [\"tongs\"] in anvil/anvil.toml)." = "Appels au jeu dans une partie ironman. Anvil doit aussi autoriser Tongs en ironman (allow_ironman = [\"tongs\"] dans anvil/anvil.toml)."
"Game calls in multiplayer" = "Appels au jeu en multijoueur"
"Game calls in a multiplayer game. Anvil also has to allow Tongs in multiplayer (allow_multiplayer = [\"tongs\"] in anvil/anvil.toml)." = "Appels au jeu dans une partie multijoueur. Anvil doit aussi autoriser Tongs en multijoueur (allow_multiplayer = [\"tongs\"] dans anvil/anvil.toml)."
"Loopback socket under Wine" = "Socket de bouclage sous Wine"
"Under Wine and Proton, also serves the pipe's commands on a socket on 127.0.0.1, so that a native Linux client can reach Tongs without a relay. It needs Open the pipe. The port and a token go to bridge.json in the folder below, which only you should be able to enter. Ignored on Windows." = "Sous Wine et Proton, sert aussi les commandes du canal sur un socket en 127.0.0.1, afin qu'un client Linux natif atteigne Tongs sans relais. Nécessite « Ouvrir le canal ». Le port et un jeton vont dans bridge.json, dans le dossier ci-dessous, que toi seul devrais pouvoir ouvrir. Ignoré sous Windows."
"Folder of bridge.json" = "Dossier de bridge.json"
"Where bridge.json goes, as a Unix path such as /run/user/1000/tongs or a Windows path. Empty means ~/.local/state/tongs. Whoever can read the token can drive the game, so use a folder only you can enter." = "Où bridge.json est écrit, comme chemin Unix (par exemple /run/user/1000/tongs) ou chemin Windows. Vide signifie ~/.local/state/tongs. Qui peut lire le jeton peut piloter le jeu : choisis un dossier que toi seul peux ouvrir."
"Wine and Proton" = "Wine et Proton"
