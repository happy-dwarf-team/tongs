# The plugin's texts in Traditional Chinese: the description in plugin.toml and the
# settings' texts in settings.toml, each by its English words.
# Change them together with the English text: anvil check reports an entry that no longer matches.
status = "draft"            # "checked" once a native speaker checked it

[text]
"Control EU4 from scripts and agents: a local command pipe that reads the state of a running game and, when allowed, uses its keyboard and mouse and runs console commands." = "透過腳本與代理控制 EU4：一個本機命令管道，可讀取執行中遊戲的狀態，並在允許時操作其鍵盤與滑鼠、執行主控台命令。"
"Open the pipe" = "開啟管道"
"Opens the local pipe \\\\.\\pipe\\tongs for the current Windows user, so that scripts and agents can read the game's state." = "為目前的 Windows 使用者開啟本機管道 \\\\.\\pipe\\tongs，讓腳本與代理可以讀取遊戲狀態。"
"Keyboard, mouse and navigation commands" = "鍵盤、滑鼠與導覽命令"
"Also accepts the keyboard and mouse commands (pause, speed, run_until, key, text, click...): input queued in the game's own SDL input, as a player's would be, and a hook so that the interface sees the mouse pointer; and navigation (province open, province goto), which moves the camera and opens a province's view as the game's own links do." = "同時接受鍵盤與滑鼠命令（pause、speed、run_until、key、text、click……）：輸入如同玩家操作一樣排入遊戲自身的 SDL 輸入佇列，並透過一個掛鉤讓介面看到滑鼠指標；也接受導覽命令（province open、province goto），它們會像遊戲內建的連結一樣移動鏡頭並開啟省份檢視。"
"Command journal" = "命令日誌"
"Writes every command a script or agent sends on the pipe, with its outcome and the game date, to anvil/data/tongs/journal/ (one file per game start, the newest 20 kept), so a test can be followed and repeated. Nothing of it goes into the game, its saves or multiplayer." = "將腳本或代理透過管道傳送的每條命令連同結果與遊戲日期寫入 anvil/data/tongs/journal/（每次啟動遊戲一個檔案，保留最新的 20 個），以便追蹤與重複測試。這些內容不會進入遊戲、存檔或多人遊戲。"
"Game calls (console commands)" = "遊戲呼叫（主控台命令）"
"Also accepts `console LINE`: console commands run by the game's own code on its main thread. They CHANGE GAME STATE; every call is counted and logged. enable_all_commands and the achievement and social commands are always refused." = "同時接受 `console LINE`：由遊戲自身程式碼在其主執行緒上執行的主控台命令。它們會改變遊戲狀態；每次呼叫都會被計數並記錄。enable_all_commands 以及成就與社交命令一律拒絕。"
"Game calls" = "遊戲呼叫"
"Allowed danger commands" = "允許的危險命令"
"Danger commands that game calls may run besides the safe ones, as names separated by commas or spaces, e.g. \"leak\"." = "除安全命令外，遊戲呼叫還可以執行的危險命令，名稱之間以逗號或空格分隔，例如 \"leak\"。"
"Game calls in ironman" = "鐵人模式中的遊戲呼叫"
"Game calls in an ironman game. Anvil also has to allow Tongs in ironman (allow_ironman = [\"tongs\"] in anvil/anvil.toml)." = "鐵人模式遊戲中的遊戲呼叫。Anvil 也必須允許 Tongs 在鐵人模式中執行（在 anvil/anvil.toml 中設定 allow_ironman = [\"tongs\"]）。"
"Game calls in multiplayer" = "多人遊戲中的遊戲呼叫"
"Game calls in a multiplayer game. Anvil also has to allow Tongs in multiplayer (allow_multiplayer = [\"tongs\"] in anvil/anvil.toml)." = "多人遊戲中的遊戲呼叫。Anvil 也必須允許 Tongs 在多人遊戲中執行（在 anvil/anvil.toml 中設定 allow_multiplayer = [\"tongs\"]）。"
