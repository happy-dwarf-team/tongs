id = "tongs"
name = "Tongs"
version = "0.28.0"
authors = ["Happy Dwarf Team"]
description = "Control EU4 from scripts and agents: a local command pipe that reads the state of a running game and, when allowed, uses its keyboard and mouse and runs console commands."
api = 2
anvil = ">=1.7.0"
entry = "tongs.dll"
phase = "main"
# Every game address and offset Tongs uses; its `builds` limit Tongs to EU4 1.37.5 (Steam, win64) and 1.37.5.2 and 1.37.5.0 (GOG, win64).
symbols = "symbols.toml"
# enabled, input, game calls: the player's values live in anvil/data/tongs/settings.toml.
settings = "settings.toml"
# Input and game calls change the game. In ironman and multiplayer Anvil suspends
# Tongs unless the player allows it in anvil/anvil.toml (allow_ironman /
# allow_multiplayer = ["tongs"]); game calls then also need Tongs' own
# game_calls_ironman / game_calls_multiplayer.
affects_gameplay = true
allow_ironman = "opt-in"
allow_multiplayer = "opt-in"
issues = "https://github.com/happy-dwarf-team/tongs/issues"
repository = "https://github.com/happy-dwarf-team/tongs"

# Outer frames, main-thread work and the game session (docs/design.md, "Dispatcher").
[[dependencies]]
id = "anvil-game"
version = "^1"

# Plugin map modes (anvil-map.modes): state's map_mode_id and map_mode by id. Tongs works without it.
[[dependencies]]
id = "anvil-map"
version = "^1"
optional = true
