id = "tongs"
name = "Tongs"
version = "0.3.0"
authors = ["Happy Dwarf Team"]
description = "Control EU4 from scripts and agents: a local command pipe that reads the state of a running game and, when allowed, uses its keyboard and mouse."
api = 1
anvil = ">=0.2.0"
entry = "tongs.dll"
phase = "main"
affects_gameplay = false
game_builds = ["eu4-1.37.5-steam-win64"]

# Game code and data layout the state reader and the key input depend on (see docs/design.md).

[[expect]]
build = "eu4-1.37.5-steam-win64"
rva = 0x14321FC
bytes = "48 8B 05 75 DC F0 00 8B 98 D0 1D 00 00"
