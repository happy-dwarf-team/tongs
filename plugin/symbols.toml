# Every game address and offset Tongs uses on EU4 1.37.5 (Steam, win64) and
# 1.37.5.2 and 1.37.5.0 (GOG, win64), declared once. `anvil gen` turns this file into
# symbols.gen.hpp (sym::<name>, each value a constant when both builds have the
# same one; the others are read when the game loads, Value()); Anvil verifies
# every symbol against eu4.exe before it loads tongs.dll and skips the plugin on
# any other build or on changed bytes. The GOG build has the same code at other
# addresses and some game structs moved: each symbol was matched to the same
# instructions there and named from the eu4.pdb GOG ships, and only rva, bytes
# and points_to differ (in `build."<id>"`). GOG 1.37.5.0 has every symbol at
# the GOG 1.37.5.2 address (anvil port, anvil#187). Addresses in notes are the Steam
# build's. `anvil check plugin --exe <eu4.exe>` with each build's eu4.exe checks
# it offline and rewrites symbols.lock.
# The few offsets that no declared instruction holds stay in the code, each
# marked "not in symbols.toml" (docs/design.md, "Symbols").
builds = ["eu4-1.37.5-steam-win64", "eu4-1.37.5.2-gog-win64", "eu4-1.37.5.0-gog-win64"]

