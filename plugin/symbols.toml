# Every game address and offset Tongs uses on EU4 1.37.5 (Steam, win64), declared
# once. `anvil gen` turns this file into symbols.gen.hpp (sym::<name>, each value
# a constant); Anvil verifies every symbol against eu4.exe before it loads
# tongs.dll and skips the plugin on any other build or on changed bytes.
# `anvil check plugin --exe <eu4.exe>` checks it offline and rewrites symbols.lock.
# The few offsets that no declared instruction holds stay in the code, each
# marked "not in symbols.toml" (docs/design.md, "Symbols").
build = "eu4-1.37.5-steam-win64"

# --- Game state (docs/design.md, "State reader") ---

[symbol.root_and_date]
rva = 0x14321FC
bytes = "48 8B 05 75 DC F0 00 8B 98 D0 1D 00 00"
memory = "code"
values.root = { at = 3, rip_relative = 7 }
values.date = { at = 9, size = 4 }
note = "top bar: the game root object (global) and its current date at root+0x1DD0"

[symbol.speed_of_root]
