# Every game address and offset Tongs uses on EU4 1.37.5 (Steam, win64) and
# 1.37.5.2 and 1.37.5.0 (GOG, win64), declared once. `anvil gen` turns this file into
# symbols.gen.hpp (sym::<name>, each value with `is` a constant; the others are
# read when the game loads, Value()); Anvil verifies every symbol against
# eu4.exe before it loads tongs.dll and skips the plugin on any other build or on
# changed bytes. Each symbol states the SHA-256 and size of the bytes at its
# address (`any`: offsets not compared), not the bytes themselves (Anvil ADR
# 0003); write `bytes` while you work and run Anvil's tools/symbols-to-digest.py
# before you commit. The GOG build has the same code at other addresses and some
# game structs moved: each symbol was matched to the same instructions there,
# and only rva, the digest and points_to differ (in `build."<id>"`). GOG 1.37.5.0 has every symbol at
# the GOG 1.37.5.2 address (anvil port, anvil#187). Addresses in notes are the Steam
# build's. `anvil check plugin --exe <eu4.exe>` with each build's eu4.exe checks
# it offline and rewrites symbols.lock.
# The few offsets that no declared instruction holds stay in the code, each
# marked "not in symbols.toml" (docs/design.md, "Symbols").
builds = ["eu4-1.37.5-steam-win64", "eu4-1.37.5.2-gog-win64", "eu4-1.37.5.0-gog-win64"]

